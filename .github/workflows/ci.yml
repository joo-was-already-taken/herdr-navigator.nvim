name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:

jobs:
  check:
    name: Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check
